# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/app_logo.png"
  image_path_android: "assets/app_logo_android_full.png"

  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/app_logo_android.png"
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true

  web:
    generate: false

  windows:
    generate: false

  macos:
    generate: false
