name: Telegram Notifications

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, closed, reopened, synchronize]

jobs:
  notify:
    name: Send Telegram Notification
    runs-on: ubuntu-latest

    steps:
      # ── PUSH ──────────────────────────────────────────────────────────────
      - name: Notify on Push
        if: github.event_name == 'push'
        run: |
          MESSAGE="<b>New Push</b>%0A%0A<b>Repo:</b> <code>${{ github.repository }}</code>%0A<b>Branch:</b> <code>${{ github.ref_name }}</code>%0A<b>Author:</b> ${{ github.actor }}%0A<b>Commit:</b> ${{ github.event.head_commit.message }}%0A<a href='${{ github.event.head_commit.url }}'>View Commit</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # ── PR OPENED / REOPENED ───────────────────────────────────────────────
      - name: Notify on PR (Opened / Reopened)
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
        run: |
          ICON=$([[ "${{ github.event.action }}" == "reopened" ]] && echo "PR Reopened" || echo "New Pull Request")
          MESSAGE="<b>${ICON} #${{ github.event.pull_request.number }}</b>%0A%0A<b>Repo:</b> <code>${{ github.repository }}</code>%0A<b>Title:</b> ${{ github.event.pull_request.title }}%0A<b>Author:</b> ${{ github.event.pull_request.user.login }}%0A<b>Branch:</b> <code>${{ github.event.pull_request.head.ref }}</code> -> <code>${{ github.event.pull_request.base.ref }}</code>%0A<a href='${{ github.event.pull_request.html_url }}'>View Pull Request</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # ── PR MERGED ─────────────────────────────────────────────────────────
      - name: Notify on PR (Merged)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          MESSAGE="<b>PR Merged #${{ github.event.pull_request.number }}</b>%0A%0A<b>Repo:</b> <code>${{ github.repository }}</code>%0A<b>Title:</b> ${{ github.event.pull_request.title }}%0A<b>Author:</b> ${{ github.event.pull_request.user.login }}%0A<b>Merged by:</b> ${{ github.event.pull_request.merged_by.login }}%0A<b>Branch:</b> <code>${{ github.event.pull_request.head.ref }}</code> -> <code>${{ github.event.pull_request.base.ref }}</code>%0A<a href='${{ github.event.pull_request.html_url }}'>View Pull Request</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # ── PR CLOSED (not merged) ─────────────────────────────────────────────
      - name: Notify on PR (Closed without merge)
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == false
        run: |
          MESSAGE="<b>PR Closed (Not Merged) #${{ github.event.pull_request.number }}</b>%0A%0A<b>Repo:</b> <code>${{ github.repository }}</code>%0A<b>Title:</b> ${{ github.event.pull_request.title }}%0A<b>Author:</b> ${{ github.event.pull_request.user.login }}%0A<a href='${{ github.event.pull_request.html_url }}'>View Pull Request</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"

      # ── PR NEW COMMITS ─────────────────────────────────────────────────────
      - name: Notify on PR (New Commits Pushed)
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          MESSAGE="<b>New Commits on PR #${{ github.event.pull_request.number }}</b>%0A%0A<b>Repo:</b> <code>${{ github.repository }}</code>%0A<b>PR:</b> ${{ github.event.pull_request.title }}%0A<b>Pushed by:</b> ${{ github.actor }}%0A<b>Branch:</b> <code>${{ github.event.pull_request.head.ref }}</code>%0A<a href='${{ github.event.pull_request.html_url }}'>View Pull Request</a>"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"